name: Checks

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Check changed lines
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF"...HEAD
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git diff-tree --check --root -r HEAD
          fi

  tools-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download deployed tools script
        run: curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 https://sh.vps.dance/tools.sh -o "$RUNNER_TEMP/tools.sh"

      - name: Check deployed script syntax
        run: bash -n "$RUNNER_TEMP/tools.sh"

      - name: Check download endpoints
        env:
          SH: https://sh.vps.dance
        run: |
          set -euo pipefail
          check_http_200() {
            local name="$1"
            local url="$2"
            local expected_size="${3:-}"
            local header_file meta status content_type final_url content_length

            header_file=$(mktemp)

            if ! meta=$(curl -sSIL --retry 2 --connect-timeout 10 --max-time 45 \
              -D "$header_file" -o /dev/null \
              -w '%{http_code}\t%{content_type}\t%{url_effective}' "$url"); then
              rm -f "$header_file"
              echo "HTTP check failed: $name could not be reached: $url" >&2
              return 1
            fi
            IFS=$'\t' read -r status content_type final_url <<<"$meta"
            content_length=$(awk '
              /^HTTP\// { last = "" }
              tolower($1) == "content-length:" { last = $2; sub(/\r$/, "", last) }
              END { print last }
            ' "$header_file")
            rm -f "$header_file"
            if [[ "$status" != "200" ]]; then
              echo "Unexpected HTTP status: $name returned HTTP $status: $final_url" >&2
              return 1
            fi
            if [[ -n "$content_length" && ! "$content_length" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid response size: $name returned Content-Length '$content_length': $final_url" >&2
              return 1
            fi
            if [[ -n "$expected_size" && "$content_length" != "$expected_size" ]]; then
              echo "Unexpected response size: $name expected $expected_size bytes, got ${content_length:-unknown}: $final_url" >&2
              return 1
            fi
            if [[ "$content_type" == text/html* ]]; then
              echo "Unexpected response type: $name returned HTML instead of an asset: $final_url" >&2
              return 1
            fi
            echo "$name: HTTP $status, size ${content_length:-unknown}, type ${content_type:-unknown}"
          }

          primary_proxy_available=true
          fallback_notice_emitted=false
          check_proxied_endpoint() {
            local name="$1"
            local source_url="$2"
            local expected_size="${3:-}"
            local fallback_url="https://ghfast.top/$source_url"

            if [[ "$primary_proxy_available" == true ]]; then
              if check_http_200 "$name (sh.vps.dance)" "$SH/$source_url" "$expected_size"; then
                return 0
              fi
              primary_proxy_available=false
              echo "::warning title=Primary download proxy unavailable::sh.vps.dance failed for $name; trying ghfast.top"
            fi

            if check_http_200 "$name (ghfast.top)" "$fallback_url" "$expected_size"; then
              if [[ "$fallback_notice_emitted" == false ]]; then
                echo "::warning title=Download proxy fallback::using ghfast.top after sh.vps.dance became unavailable"
                fallback_notice_emitted=true
              fi
              return 0
            fi

            echo "::error title=Download endpoint unavailable::$name failed through sh.vps.dance and ghfast.top"
            return 1
          }

          check_direct_endpoint() {
            local name="$1"
            local url="$2"
            if check_http_200 "$name" "$url"; then
              return 0
            fi
            echo "::error title=Direct endpoint unavailable::$name failed: $url"
            return 1
          }

          declare -A release_cache
          while IFS='|' read -r name repo match; do
            echo "Checking $name"
            if [[ -z ${release_cache[$repo]+x} ]]; then
              release_cache[$repo]=$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
                "$SH/api/repos/$repo/releases/latest")
            fi
            release=${release_cache[$repo]}
            asset=$(jq -r --arg re "$match" '
              [.assets[] | select(.browser_download_url | test($re))][0]
              | if . == null then empty else [.browser_download_url, (.size | tostring)] | @tsv end
            ' <<<"$release")
            if [[ -z "$asset" ]]; then
              echo "No release asset matched '$match' in $repo" >&2
              exit 1
            fi
            IFS=$'\t' read -r url expected_size <<<"$asset"
            check_proxied_endpoint "$name" "$url" "$expected_size"
          done <<'ASSETS'
          realm-amd64|zhboner/realm|realm-x86_64-unknown-linux-gnu.tar.gz
          realm-arm64|zhboner/realm|realm-aarch64-unknown-linux-gnu.tar.gz
          gost-amd64|go-gost/gost|linux_amd64.tar.gz
          gost-arm64|go-gost/gost|linux_arm64.tar.gz
          gost-386|go-gost/gost|linux_386.tar.gz
          shadowsocks-amd64|shadowsocks/shadowsocks-rust|x86_64.*linux-gnu
          shadowsocks-arm64|shadowsocks/shadowsocks-rust|aarch64.*linux-gnu
          nali-amd64|zu1k/nali|linux-amd64
          nali-arm64|zu1k/nali|linux-armv8
          ddns-go-amd64|jeessy2/ddns-go|linux_.*x86_64
          ddns-go-arm64|jeessy2/ddns-go|linux_.*arm64
          nexttrace-amd64|nxtrace/Ntrace-core|linux_amd64
          nexttrace-arm64|nxtrace/Ntrace-core|linux_arm64
          miniserve-amd64|svenstaro/miniserve|x86_64-unknown-linux-gnu
          miniserve-arm64|svenstaro/miniserve|aarch64-unknown-linux-gnu
          miniserve-armv7|svenstaro/miniserve|armv7-unknown-linux-gnueabihf
          ASSETS

          while IFS='|' read -r name source_url; do
            echo "Checking $name"
            check_proxied_endpoint "$name" "$source_url"
          done <<'PROXIED_URLS'
          snell3-amd64|https://raw.githubusercontent.com/VPSDance/files/main/snell/v3.0.1/snell-server-v3.0.1-linux-amd64.zip
          snell3-arm64|https://raw.githubusercontent.com/VPSDance/files/main/snell/v3.0.1/snell-server-v3.0.1-linux-aarch64.zip
          snell3-armv7|https://raw.githubusercontent.com/VPSDance/files/main/snell/v3.0.1/snell-server-v3.0.1-linux-armv7l.zip
          PROXIED_URLS

          while IFS='|' read -r name url; do
            echo "Checking $name"
            check_direct_endpoint "$name" "$url"
          done <<'DIRECT_URLS'
          snell4-amd64|https://dl.nssurge.com/snell/snell-server-v4.1.1-linux-amd64.zip
          snell4-arm64|https://dl.nssurge.com/snell/snell-server-v4.1.1-linux-aarch64.zip
          snell4-armv7|https://dl.nssurge.com/snell/snell-server-v4.1.1-linux-armv7l.zip
          snell5-amd64|https://dl.nssurge.com/snell/snell-server-v5.0.0-linux-amd64.zip
          snell5-arm64|https://dl.nssurge.com/snell/snell-server-v5.0.0-linux-aarch64.zip
          snell5-armv7|https://dl.nssurge.com/snell/snell-server-v5.0.0-linux-armv7l.zip
          DIRECT_URLS

      - name: Check external installer script
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/get-hy2.sh"
          meta=$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            -o "$script" -w '%{http_code}\t%{size_download}' https://get.hy2.sh/)
          IFS=$'\t' read -r status size <<<"$meta"
          if [[ "$status" != "200" ]]; then
            echo "::error title=Unexpected HTTP status::get.hy2.sh returned HTTP $status"
            exit 1
          fi
          if [[ ! "$size" =~ ^[1-9][0-9]*$ ]] || [[ ! -s "$script" ]]; then
            echo "::error title=Invalid response size::get.hy2.sh returned an empty script"
            exit 1
          fi
          echo "get.hy2.sh: HTTP $status, downloaded $size bytes"
          bash -n "$script"
